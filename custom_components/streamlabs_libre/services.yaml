set_away_mode:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: streamlabs_libre
    away_mode:
      required: true
      selector:
        select:
          translation_key: monitoring_mode
          options:
            - "home"
            - "away"

set_valve:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: streamlabs_libre
    position:
      required: true
      selector:
        select:
          translation_key: valve_position
          options:
            - "open"
            - "close"

run_drip_detect:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: streamlabs_libre

calibrate:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: streamlabs_libre
